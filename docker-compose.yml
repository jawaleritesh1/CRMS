services:
  postgres:
    image: postgres:16-alpine
    container_name: ralix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ralix_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ralix_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ralix_network

  redis:
    image: redis:7-alpine
    container_name: ralix_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ralix_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ralix_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-ralix_crm}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-ralix_crm}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-production-hardened-jwt-secret-minimum-32-chars-ralix}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      RUN_SEED: ${RUN_SEED:-true}
      CORS_ORIGIN: "*"
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
      KNOWLARITY_BASE_URL: ${KNOWLARITY_BASE_URL:-https://sr.knowlarity.com/newsr/api/v1/click2call/}
      KNOWLARITY_API_KEY: ${KNOWLARITY_API_KEY:-}
      KNOWLARITY_AUTH_TOKEN: ${KNOWLARITY_AUTH_TOKEN:-}
      KNOWLARITY_K_NUMBER: ${KNOWLARITY_K_NUMBER:-+918047100000}
      KNOWLARITY_CALLER_ID: ${KNOWLARITY_CALLER_ID:-+918047100000}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-ralix_meta_verify_token_2026}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ralix_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ralix_client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://server:5000
    depends_on:
      - server
    networks:
      - ralix_network

  nginx:
    image: nginx:alpine
    container_name: ralix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - client
      - server
    networks:
      - ralix_network

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:

networks:
  ralix_network:
    driver: bridge
